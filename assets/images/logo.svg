<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="100%" height="100%" fill="none">
  <!-- Bloom&blush Luxury Brandmark -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;display=swap');
      .brand-title {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 38px;
        font-weight: 500;
        letter-spacing: 0.08em;
        fill: #4A121A;
      }
      .brand-amp {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 34px;
        font-style: italic;
        font-weight: 400;
        fill: #C5A880;
      }
      .brand-tagline {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 9.5px;
        font-weight: 500;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        fill: #7A3543;
      }
      .brand-location {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 8px;
        font-weight: 400;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        fill: #9D6470;
      }
      .petal {
        fill: #581825;
        transition: transform 0.3s ease;
      }
      .petal-gold {
        fill: #C5A880;
      }
    </style>
  </defs>

  <!-- Botanical Emblem Left -->
  <g transform="translate(18, 22) scale(0.95)">
    <!-- Central subtle blossom motif -->
    <path d="M 40 15 C 43 28, 48 38, 58 42 C 48 46, 43 56, 40 69 C 37 56, 32 46, 22 42 C 32 38, 37 28, 40 15 Z" fill="#581825" />
    <path d="M 40 25 C 42 34, 45 39, 52 42 C 45 45, 42 50, 40 59 C 38 50, 35 45, 28 42 C 35 39, 38 34, 40 25 Z" fill="#C5A880" opacity="0.9" />
    <!-- Delicate curved floral accents -->
    <circle cx="40" cy="42" r="3.5" fill="#FAF6F0" stroke="#581825" stroke-width="1.5" />
    <path d="M 26 28 C 31 35, 34 38, 38 40" stroke="#D8B4B8" stroke-width="1.2" stroke-linecap="round" />
    <path d="M 54 28 C 49 35, 46 38, 42 40" stroke="#D8B4B8" stroke-width="1.2" stroke-linecap="round" />
    <path d="M 26 56 C 31 49, 34 46, 38 44" stroke="#D8B4B8" stroke-width="1.2" stroke-linecap="round" />
    <path d="M 54 56 C 49 49, 46 46, 42 44" stroke="#D8B4B8" stroke-width="1.2" stroke-linecap="round" />
    <!-- Fine luxury boundary ring -->
    <circle cx="40" cy="42" r="34" stroke="#C5A880" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6" />
  </g>

  <!-- Typography Right -->
  <g transform="translate(106, 52)">
    <!-- Brand Title -->
    <text x="0" y="0">
      <tspan class="brand-title">Bloom</tspan><tspan class="brand-amp">&amp;</tspan><tspan class="brand-title">blush</tspan>
    </text>
    
    <!-- Dividing Micro-Line -->
    <line x1="1" y1="12" x2="280" y2="12" stroke="#E2D4C3" stroke-width="0.75" />
    <circle cx="140" cy="12" r="2" fill="#C5A880" />

    <!-- Tagline & Craft -->
    <text x="0" y="27" class="brand-tagline">Boutique Floral &amp; Luxury Gifting</text>
    <text x="0" y="41" class="brand-location">Pimpri-Chinchwad • Pune</text>
  </g>
</svg>
